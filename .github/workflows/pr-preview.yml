name: pr-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      # The application is built with a relative base, so one build serves any path and the
      # preview needs no rebuild-time knowledge of where it will be published.
      - run: pnpm build
        if: github.event.action != 'closed'

      - name: Publish or remove the preview
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          if [ "${{ github.event.action }}" = "closed" ]; then
            bash scripts/pages/publish.sh preview-remove "${{ github.event.number }}"
          else
            bash scripts/pages/publish.sh preview "${{ github.event.number }}"
          fi

      - name: Link the preview from the pull request
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          name="${REPO##*/}"
          url="https://${owner,,}.github.io/${name}/pr-preview/pr-${PR}/"
          marker="<!-- j-ocean:pr-preview -->"
          body="${marker}
          **Preview of this pull request:** ${url}

          A static instance of the application built from this branch's head. It is a real
          build with no fixtures: what it shows is what the code does.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --jq \
            ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="${body}" > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="${body}" > /dev/null
          fi
